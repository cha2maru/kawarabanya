[project]
name = "kawarabanya"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer>=3.5.2",
    "cssselect>=1.6.0",
    "discord-py>=2.7.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "trafilatura>=2.3.1",
]

[project.scripts]
kawarabanya = "kawarabanya:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
