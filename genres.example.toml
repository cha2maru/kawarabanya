# kawarabanya のジャンル定義の見本。genres.toml にコピーして使う。
#
# - [ジャンル] が Discord のフォーラム 1 つになる（キーはチャンネル名。英小文字推奨）
# - [ジャンル.サブジャンル] はフォーラム内のタグになる（サブジャンルの下にはジャンルを作れない）
#   数の制約: 1 ジャンル 20 個まで（Discord のタグの上限）・名前は 20 字まで。全体で 51 個を超えると振り分けが 2 段階になり遅くなる（DESIGN.md）
#   ジャンルに直接書いたフィードの記事は、ローカル LLM が全ジャンルのサブジャンルから判定してタグを付ける
#   （別のジャンルのサブジャンルなら、そのジャンルのフォーラムに投稿する。どれにも当てはまらない記事がたまると
#   `kawarabanya genres suggest` が新しいサブジャンルを考えて、このファイルの末尾に書き足す）
# - feeds にはフィードの URL を書く（取り込み時の URL でも、移転後の URL でもよい）。1 つの URL は 1 か所だけ
# - フィードを移すには URL の行を別のジャンルに移して `kawarabanya genres apply`
# - priority で、そのジャンルの重要度の判定基準を書ける（サブジャンルに書けばそちらが優先）
# - interest で好き嫌いを書ける: like（まとめの上位に寄せる）/ down（まとめの下の方に）/ low（投稿はするが、まとめに載せない）/ mute（投稿もしない）
#   サイトごとには kawarabanya feeds option <ID> interest down（genres.toml ではなく DB に入る。ジャンルの設定より優先）
# - RSS のないサイトは、feeds にテーブルで HTML 取り込み（CSS セレクタ）か拡張（extension = "名前"、extensions/名前.py）を書く（README）
# - ジャンルを足したら `kawarabanya discord setup --apply` でフォーラム・タグを作る

[news]
label = "ニュース"
description = "国内・国際・社会の総合ニュース"
feeds = [
  "https://news.yahoo.co.jp/rss/categories/domestic.xml",  # 国内 - Yahoo!ニュース
]

[news.world]
label = "国際"
description = "海外の出来事・外交・国際情勢"   # 記事ごとにローカル LLM が振り分けるときの手がかり
# ここに書いたフィードは判定せず、すべてこのサブジャンルになる
feeds = [
  "https://news.yahoo.co.jp/rss/categories/world.xml",  # 国際 - Yahoo!ニュース
]

[tech]
label = "テック"
description = "IT・ガジェット・開発"
# 重要度の判定基準（省略すると既定の基準）。A の確率が [summarize] priority_threshold 以上の記事だけ要約する
priority = "A: 高い（多くの人に影響する事件・大きな発表・業界の転換点） B: 普通（一般的な新製品・アップデート・解説） C: 低い（セール・広告・小ネタ・ランキング）"
feeds = [
  "https://gigazine.net/news/rss_2.0/",  # GIGAZINE
]
